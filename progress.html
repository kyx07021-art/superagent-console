<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="app.css">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SuperAgent 系统实现状态图</title>
<style>
  :root {
    --bg: #0a0c10; --text: #e8ebf1; --muted: #8b94a5; --dim: #5c6577;
    --gray: #5b6474; --red: #f87171; --yellow: #f5b13d; --green: #34d399;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 14px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }

  header.top { display: flex; align-items: flex-end; gap: 26px; flex-wrap: wrap;
    padding: 22px 32px 14px; border-bottom: 1px solid #202634; }
  header.top h1 { margin: 0; font-size: 18px; letter-spacing: .4px; font-weight: 650; }
  header.top .lede { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; }
  .counts { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border-radius: 999px;
    border: 1px solid #262d3c; background: #12161e; font-size: 12px; }
  .chip b { font-variant-numeric: tabular-nums; font-weight: 650; }
  .swatch { width: 9px; height: 9px; border-radius: 3px; background: var(--c); }
  .legend { display: flex; gap: 22px; flex-wrap: wrap; padding: 10px 32px;
    border-bottom: 1px solid #202634; background: #0c0f14; }
  .legend div { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }

  main { padding: clamp(14px, 2vw, 24px) clamp(12px, 2.2vw, 32px) 6px; max-width: none; margin: 0; }

  .map {
    position: relative;
    display: grid;
    /* 列宽跟着窗口连续收，收到下限再换布局；不再一下卡死在某个最小宽度上 */
    grid-template-columns: minmax(300px, 520px) minmax(180px, 250px) minmax(280px, 470px);
    grid-template-areas:
      ".    entry  entry"
      "recv maint  maint"
      "recv router worker";
    gap: clamp(14px, 2.2vw, 30px) clamp(10px, 1.8vw, 26px);
    justify-content: center;
    padding-bottom: 34px;
  }
  #links { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; overflow: visible; }
  #links path { fill: none; stroke: #7b88a5; stroke-width: 1.3; stroke-linecap: round; }
  #links path.loop { stroke-dasharray: 4 4; stroke: #5d6885; }

  .module { position: relative; }
  .mlabel { font-size: 11px; letter-spacing: 1.5px; color: var(--muted); margin: 0 0 8px 3px; font-weight: 600; }
  .box { position: relative; border-radius: 14px; padding: 16px; }
  .box::before { content: ""; position: absolute; inset: 0; z-index: 0;
    border: 1px solid #2b3346; border-radius: 14px; background: #10141c; }
  .box > * { position: relative; z-index: 2; }

  .m-entry { grid-area: entry; justify-self: start; width: min(430px, 100%); }
  .m-recv { grid-area: recv; }
  .m-maint { grid-area: maint; }
  .m-router { grid-area: router; }
  .m-worker { grid-area: worker; }

  .node[data-status="green"],  .row[data-status="green"]  { --fill:#12301f; --edge:#2f6444; --dot:#34d399; --name:#e3fbef; --note:#8fbfa6; }
  .node[data-status="yellow"], .row[data-status="yellow"] { --fill:#332a11; --edge:#6f5623; --dot:#f5b13d; --name:#fcefd5; --note:#c2aa7d; }
  .node[data-status="red"],    .row[data-status="red"]    { --fill:#3c1a1d; --edge:#703034; --dot:#f87171; --name:#ffe2e2; --note:#c9969a; }
  .node[data-status="gray"],   .row[data-status="gray"]   { --fill:#1b1f28; --edge:#323a49; --dot:#788293; --name:#c3cad6; --note:#8792a3; }

  .node { background: var(--fill); border: 1px solid var(--edge); border-radius: 9px;
    padding: 10px 12px; z-index: 2;
    transition: transform .16s ease, border-color .16s ease;
    opacity: 0; animation: rise .3s ease forwards; animation-delay: calc(var(--i) * 12ms); }
  .node:hover { transform: translateY(-1px); border-color: var(--dot); }
  .node .name { font-size: 12.8px; font-weight: 600; color: var(--name); overflow-wrap: anywhere; }
  .node .note { font-size: 11px; color: var(--note); margin-top: 2px; overflow-wrap: anywhere; }

  .row { display: flex; align-items: center; gap: 8px; background: var(--fill); border: 1px solid var(--edge);
    border-radius: 7px; padding: 6px 9px; z-index: 2; min-width: 0;
    opacity: 0; animation: rise .3s ease forwards; animation-delay: calc(var(--i) * 12ms); }
  .row .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dot); flex: 0 0 auto; }
  .row .nm { flex: 1 1 auto; min-width: 0; font-size: 12.2px; color: var(--name);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .nt { flex: 0 0 auto; font-size: 10.5px; color: var(--note); white-space: nowrap; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .entry-row { display: flex; gap: 14px; }
  .entry-row .node { flex: 1 1 0; }

  .recv { display: flex; gap: clamp(44px, 6vw, 88px); align-items: center; }
  .recv-list { flex: 1 1 auto; display: grid; gap: 7px; }
  .recv-stage { flex: 0 1 clamp(110px, 13vw, 148px); }

  .maint { display: flex; gap: 20px; align-items: center; }
  .maint-main { flex: 0 1 clamp(180px, 19vw, 250px); }
  .maint-side { flex: 1 1 auto; display: grid; gap: 10px; }

  .stack { display: grid; gap: 12px; }

  .work { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px 20px; align-items: start; }
  .work .col { display: grid; gap: 10px; }

  footer { padding: 0 32px 26px; color: var(--dim); font-size: 11.5px; display: flex; gap: 18px; flex-wrap: wrap; }
  footer code { font-family: ui-monospace, Consolas, monospace; color: var(--muted); }
  a { color: #6ea8fe; text-decoration: none; }
</style>
</head>
<body>
<header><div class="brand">SuperAgent</div><nav><a href="./">工作台</a><a class="on" href="progress">进度</a></nav><div class="counts" id="counts"></div></header>

<div class="legend" id="legend"></div>
<main><div class="map" id="map"><svg id="links"></svg><div id="body" style="display:contents"></div></div></main>

<script src="data.js"></script>
<script>
const ORDER = ['green', 'yellow', 'red', 'gray']
const $ = s => document.querySelector(s)
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))

let map = null
let index = 0

function node(id, asRow) {
  const n = map.nodes[id]
  if (!n) return ''
  if (asRow) {
    return `<div class="row" data-id="${esc(id)}" data-status="${n.status}" style="--i:${index++}">
      <span class="dot"></span><span class="nm">${esc(n.name)}</span><span class="nt">${esc(n.note)}</span></div>`
  }
  return `<article class="node" data-id="${esc(id)}" data-status="${n.status}" style="--i:${index++}">
    <div class="name">${esc(n.name)}</div><div class="note">${esc(n.note)}</div></article>`
}

function render(data) {
  map = data
  const counts = { gray: 0, red: 0, yellow: 0, green: 0 }
  for (const n of Object.values(data.nodes)) counts[n.status] = (counts[n.status] || 0) + 1

  $('#legend').innerHTML = data.legend.map(item => {
    const c = getComputedStyle(document.documentElement).getPropertyValue('--' + item.key)
    return `<div><span class="swatch" style="background:${c.trim()}"></span>${esc(item.label)}
      <span style="color:var(--dim)">· ${esc(item.hint)}</span></div>`
  }).join('')
  $('#counts').innerHTML = ORDER.filter(k => counts[k]).map(k => {
    const c = getComputedStyle(document.documentElement).getPropertyValue('--' + k)
    const label = (data.legend.find(l => l.key === k) || {}).label || k
    return `<span class="chip"><span class="swatch" style="background:${c.trim()}"></span>${esc(label)} <b>${counts[k]}</b></span>`
  }).join('')
  const stamp = $('#updated')
  if (stamp) stamp.textContent = data.updatedAt

  const r = id => node(id, true)
  const c = id => node(id, false)

  $('#body').innerHTML = `
    <section class="module m-entry">
      <div class="mlabel">用户交互入口</div>
      <div class="box"><div class="entry-row">${c('console')}${c('wechat-bridge')}</div></div>
    </section>

    <section class="module m-recv">
      <div class="mlabel">消息接收器</div>
      <div class="box"><div class="recv">
        <div class="recv-list">
          ${r('timer')}${r('wechat')}${r('wecom')}${r('mail')}${r('campus')}${r('x')}${r('console-events')}${r('reentry')}${r('worker-report')}
        </div>
        <div class="recv-stage">${c('rectifier')}</div>
      </div></div>
    </section>

    <section class="module m-maint">
      <div class="mlabel">SuperAgent 状态维护模块</div>
      <div class="box"><div class="maint">
        <div class="maint-main">${c('relay')}</div>
        <div class="maint-side">${c('memory')}${c('interaction')}</div>
      </div></div>
    </section>

    <section class="module m-router">
      <div class="mlabel">router 中枢</div>
      <div class="box"><div class="stack">${c('cli-session')}${c('router-manager')}${c('stats')}</div></div>
    </section>

    <section class="module m-worker">
      <div class="mlabel">Worker 执行模块</div>
      <div class="box"><div class="work">
        <div class="col">${c('knowledge-api')}</div>
        <div class="col">${c('obsidian')}${c('papers')}</div>
        <div class="col">${c('worker-manager')}</div>
        <div class="col">${c('supervisor')}${c('worker-session')}</div>
        <div class="col">${c('outbox')}</div>
        <div class="col"></div>
      </div></div>
    </section>`

  requestAnimationFrame(() => requestAnimationFrame(() => draw(true)))
}

function boxOf(el, box) {
  const r = el.getBoundingClientRect()
  return { x: r.left - box.left + r.width / 2, y: r.top - box.top + r.height / 2, w: r.width, h: r.height }
}

// 按两块卡片的位置关系选边：先看投影是否重叠，再看哪个方向的间隙更小。
function pickSides(a, b) {
  const ax1 = a.x - a.w / 2, ax2 = a.x + a.w / 2, ay1 = a.y - a.h / 2, ay2 = a.y + a.h / 2
  const bx1 = b.x - b.w / 2, bx2 = b.x + b.w / 2, by1 = b.y - b.h / 2, by2 = b.y + b.h / 2
  const overlapX = Math.min(ax2, bx2) - Math.max(ax1, bx1)
  const overlapY = Math.min(ay2, by2) - Math.max(ay1, by1)
  const dx = b.x - a.x, dy = b.y - a.y
  const horizontal = () => dx >= 0 ? ['right', 'left'] : ['left', 'right']
  const vertical = () => dy >= 0 ? ['bottom', 'top'] : ['top', 'bottom']
  if (overlapX > 0 && overlapY > 0) return Math.abs(dx) >= Math.abs(dy) ? horizontal() : vertical()
  if (overlapX > 0) return vertical()
  if (overlapY > 0) return horizontal()
  const gapX = Math.abs(dx) - (a.w + b.w) / 2
  const gapY = Math.abs(dy) - (a.h + b.h) / 2
  return gapX <= gapY ? horizontal() : vertical()
}

function sidePoint(rect, side) {
  if (side === 'left') return { x: rect.x - rect.w / 2, y: rect.y }
  if (side === 'right') return { x: rect.x + rect.w / 2, y: rect.y }
  if (side === 'top') return { x: rect.x, y: rect.y - rect.h / 2 }
  return { x: rect.x, y: rect.y + rect.h / 2 }
}

function elbow(points, radius = 8) {
  if (points.length < 2) return ''
  let d = `M${points[0].x},${points[0].y}`
  for (let i = 1; i < points.length - 1; i++) {
    const prev = points[i - 1], cur = points[i], next = points[i + 1]
    const v1 = { x: cur.x - prev.x, y: cur.y - prev.y }
    const v2 = { x: next.x - cur.x, y: next.y - cur.y }
    const l1 = Math.hypot(v1.x, v1.y), l2 = Math.hypot(v2.x, v2.y)
    if (l1 < 1 || l2 < 1) { d += ` L${cur.x},${cur.y}`; continue }
    const rr = Math.min(radius, l1 / 2, l2 / 2)
    const a = { x: cur.x - (v1.x / l1) * rr, y: cur.y - (v1.y / l1) * rr }
    const b = { x: cur.x + (v2.x / l2) * rr, y: cur.y + (v2.y / l2) * rr }
    d += ` L${a.x},${a.y} Q${cur.x},${cur.y} ${b.x},${b.y}`
  }
  const last = points[points.length - 1]
  return d + ` L${last.x},${last.y}`
}

// "出边>入边"，可带 both / loop
function parseSpec(spec) {
  if (!spec) return { kind: '', sides: null, both: false }
  let text = String(spec).trim()
  let both = false
  if (/\bboth\b/.test(text)) { both = true; text = text.replace(/\bboth\b/, '').trim() }
  const m = text.match(/^(left|right|top|bottom)\s*>\s*(left|right|top|bottom)$/)
  if (m) return { kind: '', sides: [m[1], m[2]], both }
  return { kind: text, sides: null, both }
}

function draw(animate = false) {
  if (!map) return
  const box = $('#map').getBoundingClientRect()
  const svg = $('#links')
  svg.setAttribute('width', box.width)
  svg.setAttribute('height', box.height)
  svg.setAttribute('viewBox', `0 0 ${box.width} ${box.height}`)

  const pos = new Map()
  for (const el of document.querySelectorAll('[data-id]')) pos.set(el.dataset.id, boxOf(el, box))

  const routes = []
  map.edges.forEach(([fromId, toId, spec], i) => {
    const a = pos.get(fromId), b = pos.get(toId)
    if (!a || !b) return
    const parsed = parseSpec(spec)
    if (parsed.kind === 'loop') {
      const floor = box.height - 10
      const start = sidePoint(a, 'bottom')
      const end = sidePoint(b, 'left')
      routes.push({ i, cls: 'loop', both: false, entry: 'left', toId,
        points: [start, { x: start.x, y: floor }, { x: 16, y: floor }, { x: 16, y: end.y }, end] })
      return
    }
    const [fromSide, toSide] = parsed.sides || pickSides(a, b)
    const p1 = sidePoint(a, fromSide)
    const p2 = sidePoint(b, toSide)
    const fromH = fromSide === 'left' || fromSide === 'right'
    const toH = toSide === 'left' || toSide === 'right'
    let points
    if (fromH && toH) {
      const midX = (p1.x + p2.x) / 2
      points = [p1, { x: midX, y: p1.y }, { x: midX, y: p2.y }, p2]
    } else if (!fromH && !toH) {
      const midY = (p1.y + p2.y) / 2
      points = [p1, { x: p1.x, y: midY }, { x: p2.x, y: midY }, p2]
    } else if (fromH) {
      points = [p1, { x: p2.x, y: p1.y }, p2]
    } else {
      points = [p1, { x: p1.x, y: p2.y }, p2]
    }
    routes.push({ i, cls: '', both: parsed.both, entry: toSide, toId, points })
  })

  const groups = new Map()
  for (const route of routes) {
    const key = route.toId + ':' + route.entry
    if (!groups.has(key)) groups.set(key, [])
    groups.get(key).push(route)
  }
  for (const list of groups.values()) {
    if (list.length < 2) continue
    const target = pos.get(list[0].toId)
    const onVertical = list[0].entry === 'left' || list[0].entry === 'right'
    const span = onVertical ? target.h : target.w
    const step = Math.min(11, (span * 0.62) / list.length)
    list.forEach((route, k) => {
      const offset = (k - (list.length - 1) / 2) * step
      // 每条单独的竖向/横向拐道错开，否则几条线会叠成一根
      const lane = (k - (list.length - 1) / 2) * 8
      const pts = route.points
      if (pts.length === 4) {
        if (Math.abs(pts[1].x - pts[2].x) < 0.5) {
          pts[1] = { x: pts[1].x + lane, y: pts[1].y }
          pts[2] = { x: pts[2].x + lane, y: pts[2].y }
        } else {
          pts[1] = { x: pts[1].x, y: pts[1].y + lane }
          pts[2] = { x: pts[2].x, y: pts[2].y + lane }
        }
      }
      const n = pts.length
      const tip = pts[n - 1]
      if (onVertical) {
        pts[n - 1] = { x: tip.x, y: tip.y + offset }
        if (n > 3) pts[n - 2] = { x: pts[n - 2].x, y: tip.y + offset }
      } else {
        pts[n - 1] = { x: tip.x + offset, y: tip.y }
        if (n > 3) pts[n - 2] = { x: tip.x + offset, y: pts[n - 2].y }
      }
    })
  }

  const parts = routes.map(route =>
    `<path class="${route.cls}" d="${elbow(route.points)}"${route.both ? ' marker-start="url(#arrowBack)"' : ''} marker-end="url(#arrow)" data-i="${route.i}"/>`)

  // 六路来源收成一条总线：每行一根短横线，合并成一条竖干，再用一个箭头插进整流器
  if (map.bus) {
    const target = pos.get(map.bus.target)
    const sources = (map.bus.sources || []).map(id => pos.get(id)).filter(Boolean)
    if (target && sources.length) {
      const trunkX = Math.round(target.x - target.w / 2 - 28)
      const ys = sources.map(s => s.y)
      for (const s of sources) {
        parts.push(`<path d="M${Math.round(s.x + s.w / 2)},${Math.round(s.y)} L${trunkX},${Math.round(s.y)}"/>`)
      }
      parts.push(`<path d="M${trunkX},${Math.round(Math.min(...ys))} L${trunkX},${Math.round(Math.max(...ys))}"/>`)
      parts.push(`<path d="M${trunkX},${Math.round(target.y)} L${Math.round(target.x - target.w / 2)},${Math.round(target.y)}" marker-end="url(#arrow)"/>`)
    }
  }

  svg.innerHTML = `<defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8b97b4" stroke="none"/></marker>
    <marker id="arrowBack" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8b97b4" stroke="none"/></marker>
  </defs>${parts.join('')}`

  if (animate) {
    let step = 0
    for (const path of svg.querySelectorAll('path[data-i]')) {
      const len = path.getTotalLength()
      path.style.strokeDasharray = `${len}`
      path.style.strokeDashoffset = `${len}`
      path.style.transition = `stroke-dashoffset .4s ease ${step++ * 10}ms`
      requestAnimationFrame(() => { path.style.strokeDashoffset = '0' })
    }
  }
}

// 箭头和卡片是同一份几何：窗口一动就按新位置重算，不另跑一套动画。
let frame = 0
function schedule() {
  if (frame) return
  frame = requestAnimationFrame(() => { frame = 0; draw(false) })
}

if ('ResizeObserver' in window) new ResizeObserver(schedule).observe(document.getElementById('map'))
addEventListener('resize', schedule)

render((window.SUPERAGENT || {}).map || { nodes: {}, edges: [] })
</script>
</body>
</html>
